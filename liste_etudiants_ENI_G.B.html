<style>

    --surface: #131929;
    --surface2: #1a2236;

    --accent2: #60a5fa;
    --text: #e2e8f0;

    --highlight: #1e3a5f;
    --found: #0f2a1a;

    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  header {
    background: linear-gradient(135deg, #0d1b35 0%, #091428 100%);
    border-bottom: 1px solid var(--border);
    padding: 32px 24px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 400px; height: 200px;
    background: radial-gradient(ellipse, rgba(59,130,246,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .badge {
    display: inline-block;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.4);
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  h1 span { color: var(--accent2); }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .search-area {
    max-width: 700px;
    margin: 32px auto 0;
    padding: 0 20px;
  }

  .search-wrap {
    position: relative;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    color: var(--muted);
    font-size: 16px;
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px 14px 44px;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }

  #searchInput::placeholder { color: var(--muted); }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 16px;
    border-radius: 4px;
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--highlight);
    border-color: var(--accent);
    color: var(--accent2);
  }

  .stats {
    max-width: 700px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .stats .count { color: var(--accent2); font-weight: 700; }

  main {
    max-width: 900px;
    margin: 24px auto 0;
    padding: 0 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    background: var(--surface2);
    padding: 12px 16px;
    text-align: left;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  thead th:first-child { width: 60px; text-align: center; }
  thead th:nth-child(2) { width: 120px; }

  tbody tr {
    border-bottom: 1px solid rgba(42,54,80,0.5);
    transition: background 0.1s;
  }

  tbody tr:hover { background: rgba(59,130,246,0.05); }

  tbody tr.match {
    background: var(--found);
    border-bottom: 1px solid rgba(34,197,94,0.2);
  }

  tbody tr.match td:nth-child(2) {
    color: var(--found-border);
    font-weight: 700;
  }

  td {
    padding: 11px 16px;
    font-size: 13.5px;
  }

  td:first-child {
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  td:nth-child(2) {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--accent2);
  }

  .cell-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .copy-button {
    display: inline-grid;
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    place-items: center;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, background .15s, border-color .15s;
  }

  .copy-button:hover, .copy-button:focus-visible {
    border-color: var(--border);
    outline: none;
    background: var(--surface2);
    color: var(--accent2);
  }

  .copy-button svg { width: 15px; height: 15px; }
  .copy-button.copied { color: var(--found-border); }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    clip-path: inset(50%);

    color: #fbbf24;
    border-radius: 2px;

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  doSearch();
}

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const safeText = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return safeText.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="highlight-text">$1</span>');
}

function escapeHtml(text) {
  return String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const copyIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.7"/></svg>';
const copiedIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch {
      // Use the legacy copy command if clipboard permissions are unavailable.
    }
  }

  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.setAttribute('readonly', '');
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  const copied = document.execCommand('copy');
  textarea.remove();
  if (!copied) throw new Error('Le navigateur a refusé la copie.');
}

document.getElementById('tableBody').addEventListener('click', async event => {
  const button = event.target.closest('.copy-button');
  if (!button) return;

  const status = document.getElementById('copyStatus');
  try {
    await copyText(button.dataset.copy);
    button.classList.add('copied');
    button.innerHTML = copiedIcon;
    button.setAttribute('aria-label', 'Copié');
    status.textContent = button.dataset.copyType === 'ins' ? 'Matricule copié.' : 'Nom copié.';
    window.setTimeout(() => {
      button.classList.remove('copied');
      button.innerHTML = copyIcon;
      button.setAttribute('aria-label', `Copier ${button.dataset.copyType === 'ins' ? 'le matricule' : 'le nom'} ${button.dataset.copy}`);
    }, 1200);
  } catch {
    status.textContent = 'Copie impossible. Vérifiez les autorisations du navigateur.';
  }
});

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  currentQuery = q;
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  let count = 0;

  students.forEach(([num, ins, name]) => {
    const insStr = String(ins);
    let match = false;

    if (!q) {
      match = true;
    } else if (currentFilter === 'ins') {
      match = insStr.includes(q);
    } else if (currentFilter === 'name') {
      match = name.toLowerCase().includes(q);
    } else {
      match = insStr.includes(q) || name.toLowerCase().includes(q);
    }

    if (match) {
      count++;
      const tr = document.createElement('tr');
      if (q) tr.classList.add('match');
      tr.innerHTML = `
        <td>${num}</td>
        <td><div class="cell-content">${highlight(insStr, q)}<button class="copy-button" type="button" data-copy-type="ins" data-copy="${insStr}" aria-label="Copier le matricule ${insStr}" title="Copier le matricule">${copyIcon}</button></div></td>
        <td><div class="cell-content">${highlight(name, q)}<button class="copy-button" type="button" data-copy-type="name" data-copy="${escapeHtml(name)}" aria-label="Copier le nom ${escapeHtml(name)}" title="Copier le nom">${copyIcon}</button></div></td>
      `;
      tbody.appendChild(tr);
    }
  });

  document.getElementById('countDisplay').textContent = count;
  document.getElementById('noResult').style.display = count === 0 ? 'block' : 'none';
  document.querySelector('table').style.display = count === 0 ? 'none' : '';
  document.getElementById('searchStatus').textContent = q ? `pour "${q}"` : '';
}

document.getElementById('searchInput').addEventListener('input', doSearch);
doSearch();
</script>
</body>
</html>
