<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENI — Liste Étudiants L2 ASR 2025-2026</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #140a06;
    --surface: #1f1008;
    --surface2: #2a160a;
    --border: #4a2010;
    --accent: #c2410c;
    --accent2: #fb923c;
    --text: #fde8d8;
    --muted: #a06040;
    --highlight: #3d1a0a;
    --found: #1a0f05;
    --found-border: #ea580c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  header {
    background: linear-gradient(135deg, #1f0d04 0%, #110704 100%);
    border-bottom: 1px solid var(--border);
    padding: 32px 24px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 400px; height: 200px;
    background: radial-gradient(ellipse, rgba(194,65,12,0.2) 0%, transparent 70%);
    pointer-events: none;
  }

  .badge {
    display: inline-block;
    background: rgba(194,65,12,0.18);
    border: 1px solid rgba(194,65,12,0.5);
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  h1 span { color: var(--accent2); }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .search-area {
    max-width: 700px;
    margin: 32px auto 0;
    padding: 0 20px;
  }

  .search-wrap {
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px 14px 44px;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(194,65,12,0.18);
  }

  #searchInput::placeholder { color: var(--muted); }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 16px;
    border-radius: 4px;
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--highlight);
    border-color: var(--accent);
    color: var(--accent2);
  }

  .stats {
    max-width: 700px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .stats .count { color: var(--accent2); font-weight: 700; }

  main {
    max-width: 900px;
    margin: 24px auto 0;
    padding: 0 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    background: var(--surface2);
    padding: 12px 16px;
    text-align: left;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  thead th:first-child { width: 60px; text-align: center; }
  thead th:nth-child(2) { width: 120px; }

  tbody tr {
    border-bottom: 1px solid rgba(74,32,16,0.5);
    transition: background 0.1s;
  }

  tbody tr:hover { background: rgba(194,65,12,0.07); }

  tbody tr.match {
    background: var(--found);
    border-bottom: 1px solid rgba(234,88,12,0.25);
  }

  tbody tr.match td:nth-child(2) {
    color: var(--found-border);
    font-weight: 700;
  }

  td {
    padding: 11px 16px;
    font-size: 13.5px;
  }

  td:first-child {
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  td:nth-child(2) {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--accent2);
  }

  .cell-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .copy-button {
    display: inline-grid;
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    place-items: center;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, background .15s, border-color .15s;
  }

  .copy-button:hover, .copy-button:focus-visible {
    border-color: var(--border);
    outline: none;
    background: var(--surface2);
    color: var(--accent2);
  }

  .copy-button svg { width: 15px; height: 15px; }
  .copy-button.copied { color: var(--found-border); }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    clip-path: inset(50%);
  }

  .highlight-text {
    background: rgba(251,146,60,0.3);
    color: #fdba74;
    border-radius: 2px;
    padding: 0 2px;
  }

  .no-result {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .no-result .icon { font-size: 40px; margin-bottom: 12px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 600px) {
    td, th { padding: 9px 10px; font-size: 12px; }
    td:nth-child(3) { font-size: 11.5px; }
  }
</style>
</head>

let currentFilter = 'all';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  doSearch();
}

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const safeText = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return safeText.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="highlight-text">$1</span>');
}

function escapeHtml(text) {
  return String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const copyIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.7"/></svg>';
const copiedIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch {
      // Use the legacy copy command if clipboard permissions are unavailable.
    }
  }

  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.setAttribute('readonly', '');
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  const copied = document.execCommand('copy');
  textarea.remove();
  if (!copied) throw new Error('Le navigateur a refusé la copie.');
}

document.getElementById('tableBody').addEventListener('click', async event => {
  const button = event.target.closest('.copy-button');
  if (!button) return;

  const status = document.getElementById('copyStatus');
  try {
    await copyText(button.dataset.copy);
    button.classList.add('copied');
    button.innerHTML = copiedIcon;
    button.setAttribute('aria-label', 'Copié');
    status.textContent = button.dataset.copyType === 'ins' ? 'Matricule copié.' : 'Nom copié.';
    window.setTimeout(() => {
      button.classList.remove('copied');
      button.innerHTML = copyIcon;
      button.setAttribute('aria-label', `Copier ${button.dataset.copyType === 'ins' ? 'le matricule' : 'le nom'} ${button.dataset.copy}`);
    }, 1200);
  } catch {
    status.textContent = 'Copie impossible. Vérifiez les autorisations du navigateur.';
  }
});

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  let count = 0;

  students.forEach(([num, ins, name]) => {
    const insStr = String(ins);
    let match = false;

    if (!q) {
      match = true;
    } else if (currentFilter === 'ins') {
      match = insStr.includes(q);
    } else if (currentFilter === 'name') {
      match = name.toLowerCase().includes(q);
    } else {
      match = insStr.includes(q) || name.toLowerCase().includes(q);
    }

    if (match) {
      count++;
      const tr = document.createElement('tr');
      if (q) tr.classList.add('match');
      tr.innerHTML = `
        <td>${num}</td>
        <td><div class="cell-content">${highlight(insStr, q)}<button class="copy-button" type="button" data-copy-type="ins" data-copy="${insStr}" aria-label="Copier le matricule ${insStr}" title="Copier le matricule">${copyIcon}</button></div></td>
        <td><div class="cell-content">${highlight(name, q)}<button class="copy-button" type="button" data-copy-type="name" data-copy="${escapeHtml(name)}" aria-label="Copier le nom ${escapeHtml(name)}" title="Copier le nom">${copyIcon}</button></div></td>
      `;
      tbody.appendChild(tr);
    }
  });

  document.getElementById('countDisplay').textContent = count;
  document.getElementById('noResult').style.display = count === 0 ? 'block' : 'none';
  document.querySelector('table').style.display = count === 0 ? 'none' : '';
  document.getElementById('searchStatus').textContent = q ? `pour "${q}"` : '';
}

document.getElementById('searchInput').addEventListener('input', doSearch);
doSearch();
